version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  back:
    build:
      context: ./apps/back
      dockerfile: Dockerfile.prod
    environment:
      PG_URL: ${PG_URL_DOCKER}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - db
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skillswap-back.rule=Host(`${BACK_HOST:-api.skillswap.local}`)"
      - "traefik.http.routers.skillswap-back.entrypoints=web,websecure"
      - "traefik.http.routers.skillswap-back.tls=true"
      - "traefik.http.services.skillswap-back.loadbalancer.server.port=3000"

  front:
    build:
      context: ./apps/front
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skillswap-front.rule=Host(`${FRONT_HOST:-skillswap.local}`)"
      - "traefik.http.routers.skillswap-front.entrypoints=web,websecure"
      - "traefik.http.routers.skillswap-front.tls=true"
      - "traefik.http.services.skillswap-front.loadbalancer.server.port=80"

  proxy:
    image: nginx:stable-alpine
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - front
      - back

networks:
  traefik:
    external: true

volumes:
  db_data:
